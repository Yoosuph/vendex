<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vendex | Premium Multi-Vendor Marketplace</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Google Fonts: Inter + IBM Plex Mono + Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      /* Material Symbols fallback when CDN is unavailable */
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined', system-ui, -apple-system, sans-serif;
        font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
      }
    </style>
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('vendex_theme');
          if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-background text-on-background font-body-md selection:bg-primary-fixed selection:text-on-primary-fixed">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
